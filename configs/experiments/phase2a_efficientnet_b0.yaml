# Phase 2A Fast Backbone Screening — EfficientNet-B0
experiment:
  name: phase2a_efficientnet_b0_screening
  phase: phase2a
  type: preliminary_architecture_screening
  description: "Preliminary backbone screening for EfficientNet-B0 on primary RiceLeafDiseaseBD dataset (6 classes)."

model:
  name: efficientnet_b0
  num_classes: 6
  pretrained: true
  dropout_rate: 0.2

preprocessing:
  image_size: [224, 224]
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]

training:
  epochs: 8
  max_epochs: 8
  batch_size: 8
  num_workers: 0
  pin_memory: true
  use_cuda: true
  amp: true
  early_stopping_patience: 3
  early_stopping_min_delta: 0.0001

optimizer:
  name: adamw
  lr: 0.0001
  weight_decay: 0.0001

scheduler:
  name: cosine_annealing
  t_max: 8
  eta_min: 0.000001

early_stopping:
  monitor: val_macro_f1
  mode: max
  patience: 3

loss:
  name: cross_entropy
  label_smoothing: 0.0
  use_class_weights: false

reproducibility:
  seed: 42
