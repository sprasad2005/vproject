# Phase 2B Final Baseline Experiment Configuration — EfficientNet-B0
experiment:
  name: phase2b_final_baseline
  phase: phase2b
  type: final_classification_baseline
  description: "Final classification-only EfficientNet-B0 baseline trained on primary RiceLeafDiseaseBD dataset (6 classes)."

model:
  name: efficientnet_b0
  num_classes: 6
  pretrained: true
  dropout_rate: 0.2

preprocessing:
  image_size: [224, 224]
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]

training:
  epochs: 20
  max_epochs: 20
  batch_size: 8
  initial_batch_size: 16
  num_workers: 0
  pin_memory: true
  use_cuda: true
  amp: true
  early_stopping_patience: 5
  early_stopping_min_delta: 0.001

optimizer:
  name: adamw
  lr: 0.0001
  weight_decay: 0.0001

scheduler:
  name: cosine_annealing
  t_max: 20
  eta_min: 0.000001

early_stopping:
  monitor: val_macro_f1
  mode: max
  patience: 5
  min_delta: 0.001

loss:
  name: cross_entropy
  label_smoothing: 0.0
  use_class_weights: false

reproducibility:
  seed: 42
