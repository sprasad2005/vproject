# Phase 3 Lesion-Aware Multi-Task Experiment Configuration — EfficientNet-B0
experiment:
  name: phase3_lesion_aware
  phase: phase3
  type: lesion_aware_multitask
  description: "Joint 6-class disease classification and 7x7 spatial lesion localization using EfficientNet-B0 with bounding-box supervision."

model:
  name: efficientnet_b0_multitask
  num_classes: 6
  pretrained: true
  dropout_rate: 0.2
  grid_size: 7
  loc_hidden_dim: 256

preprocessing:
  image_size: [224, 224]
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]

training:
  epochs: 20
  max_epochs: 20
  batch_size: 8
  num_workers: 0
  pin_memory: true
  use_cuda: true
  amp: true
  early_stopping_patience: 5
  early_stopping_min_delta: 0.001

optimizer:
  name: adamw
  lr: 0.0001
  weight_decay: 0.0001

scheduler:
  name: cosine_annealing
  t_max: 20
  eta_min: 0.000001

early_stopping:
  monitor: val_macro_f1
  mode: max
  patience: 5
  min_delta: 0.001

loss:
  name: multitask_loss
  lambda_loc: 0.25
  lambda_box: 1.0
  smooth_l1_beta: 0.1
  use_class_weights: false

localization:
  grid_size: 7
  conf_threshold: 0.5
  iou_threshold: 0.5

reproducibility:
  seed: 42
