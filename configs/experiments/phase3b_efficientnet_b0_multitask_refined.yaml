# Phase 3B Lesion-Aware Multi-Task Refinement Configuration — EfficientNet-B0
experiment:
  name: phase3b_localization_refinement
  phase: phase3b
  type: lesion_aware_multitask_refinement
  description: "Controlled localization refinement of Phase 3 EfficientNet-B0 multi-task model using capped pos_weight and validation-only threshold + Top-K calibration."

initialization:
  mode: phase3_best_checkpoint
  source_checkpoint: "experiments/phase3_lesion_aware/efficientnet_b0_multitask/checkpoints/best_model.pt"
  reinitialize_optimizer: true
  reinitialize_scheduler: true

model:
  name: efficientnet_b0_multitask
  num_classes: 6
  pretrained: true
  dropout_rate: 0.2
  grid_size: 7
  loc_hidden_dim: 256

preprocessing:
  image_size: [224, 224]
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]

training:
  epochs: 12
  max_epochs: 12
  batch_size: 8
  fallback_batch_size: 4
  num_workers: 0
  pin_memory: true
  use_cuda: true
  amp: true
  early_stopping_patience: 4
  early_stopping_min_delta: 0.001

optimizer:
  name: adamw
  lr: 0.0001
  weight_decay: 0.0001

scheduler:
  name: cosine_annealing
  t_max: 12
  eta_min: 0.000001

early_stopping:
  monitor: val_macro_f1
  mode: max
  patience: 4
  min_delta: 0.001

loss:
  name: multitask_loss
  lambda_loc: 0.25
  lambda_box: 1.0
  smooth_l1_beta: 0.1
  use_class_weights: false
  pos_weight_mode: capped
  max_pos_weight: 10.0

calibration:
  threshold_grid: [0.10, 0.15, 0.20, 0.25, 0.30, 0.35, 0.40, 0.45, 0.50, 0.55, 0.60, 0.65, 0.70, 0.75, 0.80]
  top_k_grid: [3, 5, 10, null]
  iou_threshold: 0.5

reproducibility:
  seed: 42
