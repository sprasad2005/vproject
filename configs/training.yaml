training:
  epochs: 50
  early_stopping:
    patience: 10
    min_delta: 0.001
    monitor: val_loss
    mode: min

optimizer:
  name: adamw
  lr: 0.0001
  weight_decay: 0.01
  betas: [0.9, 0.999]
  eps: 1.0e-8

scheduler:
  name: cosine_annealing
  t_max: 50
  eta_min: 1.0e-6
  warmup_epochs: 5

loss:
  name: cross_entropy
  label_smoothing: 0.1
  use_class_weights: true

mixed_precision:
  enabled: true
  dtype: float16

checkpointing:
  save_best_only: true
  monitor: val_macro_f1
  mode: max
  save_interval: 1
